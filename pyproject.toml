[project]
name = "movie-recommender-team37"
version = "0.1.0"
description = "MLOps movie recommendation pipeline using Airflow, Spark, MLflow, FastAPI, Docker, and monitoring."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
